[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pharma-news"
version = "1.0.0"
description = "한국 제약사 뉴스 스킬 (삼성바이오로직스, 셀트리온, 롯데바이오로직스, LG화학, 셀트리온제약)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pharma-news = "run_news:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
